<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Script Writer</title>
<style>
  :root{--bg:#03030a;--panel:rgba(12,18,32,.78);--panel2:#0d1322;--border:#1c2740;
    --txt:#e6f0ff;--muted:#7e8db0;--cyan:#00D9FF;--pink:#FF2E9B;--violet:#B44FFF;}
  *{box-sizing:border-box}
  body{margin:0;color:var(--txt);font-family:'Rajdhani','Inter',system-ui,sans-serif;
    background:radial-gradient(1100px 520px at 78% -8%,rgba(0,217,255,.10),transparent 60%),
      radial-gradient(900px 500px at 10% 110%,rgba(255,46,155,.10),transparent 60%),var(--bg);}
  .wrap{max-width:1320px;margin:0 auto;padding:26px 24px 56px;}
  h1{font-family:'Orbitron',sans-serif;font-size:24px;letter-spacing:1px;margin:0;display:flex;align-items:center;gap:10px;}
  h1 b{color:var(--cyan);} h1 .em{filter:drop-shadow(0 0 8px rgba(0,217,255,.5));}
  .sub{color:var(--muted);font-size:13px;font-family:'JetBrains Mono',monospace;margin:6px 0 22px;}
  .studio{display:grid;grid-template-columns:380px 1fr;gap:24px;align-items:start;}
  @media(max-width:920px){.studio{grid-template-columns:1fr;}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;
    backdrop-filter:blur(6px);box-shadow:0 18px 50px rgba(0,0,0,.35);}
  .controls{padding:20px;}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;letter-spacing:.4px;}
  label:first-child{margin-top:0;}
  input[type=text],textarea,select{width:100%;background:var(--panel2);border:1px solid var(--border);
    border-radius:9px;color:var(--txt);padding:11px 13px;font-size:14px;font-family:inherit;outline:none;transition:.18s;}
  input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,217,255,.14);}
  textarea{min-height:90px;resize:vertical;line-height:1.45;}
  .row{display:flex;gap:12px;} .row>div{flex:1;}
  .go{width:100%;margin-top:18px;background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;border:0;
    border-radius:11px;padding:15px;font-weight:700;font-size:16px;cursor:pointer;font-family:'Rajdhani',sans-serif;
    letter-spacing:1px;box-shadow:0 10px 26px rgba(255,46,155,.28);transition:.18s;}
  .go:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 14px 32px rgba(255,46,155,.4);}
  .go:disabled{opacity:.55;cursor:not-allowed;}
  .status{margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);min-height:18px;}
  .status.err{color:#ff5e7a;} .status.ok{color:#39e6a4;}
  .spinner{width:14px;height:14px;border:2px solid rgba(0,217,255,.25);border-top-color:var(--cyan);
    border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:-2px;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg)}}

  .editor{padding:18px;display:flex;flex-direction:column;min-height:600px;}
  .editor-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 2px 12px;flex-wrap:wrap;}
  .counter{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);}
  .counter b{color:var(--cyan);font-size:15px;}
  .counter .tgt{color:var(--muted);}
  .ed-actions{display:flex;gap:10px;}
  .sbtn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:'Rajdhani',sans-serif;letter-spacing:.5px;border:1px solid var(--border);color:var(--txt);
    background:var(--panel2);transition:.18s;}
  .sbtn:hover{border-color:var(--cyan);color:var(--cyan);}
  .bar{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;margin:0 2px 14px;border:1px solid var(--border);}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .25s;}
  .script{flex:1;background:#05070f;border:1px solid var(--border);border-radius:12px;padding:22px 24px;
    font-size:16px;line-height:1.75;white-space:pre-wrap;overflow:auto;min-height:440px;outline:none;}
  .script:empty::before{content:"Ton script s'écrira ici en direct…";color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:13px;}
  .cursor::after{content:"▌";color:var(--cyan);animation:blink 1s steps(2) infinite;}
  @keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="em">📝</span> <b>SCRIPT</b> WRITER</h1>
  <div class="sub">Un thème + une durée de voix off → Claude écrit ton script en direct, avec compteur de mots live.</div>

  <div class="studio">
    <div class="panel controls">
      <label>Thème / sujet de la vidéo</label>
      <textarea id="theme" placeholder="Ex : Les 5 secrets des créateurs YouTube qui explosent en 2026..."></textarea>

      <label>Détails / angle (optionnel)</label>
      <textarea id="brief" placeholder="Ton, public visé, points à aborder, accroche voulue..." style="min-height:70px;"></textarea>

      <div class="row">
        <div>
          <label>Durée voix off</label>
          <select id="duration">
            <option value="1">~1 min</option>
            <option value="2">~2 min</option>
            <option value="3" selected>~3 min</option>
            <option value="5">~5 min</option>
            <option value="8">~8 min</option>
            <option value="10">~10 min</option>
            <option value="15">~15 min</option>
            <option value="20">~20 min</option>
            <option value="30">~30 min</option>
            <option value="45">~45 min</option>
            <option value="60">~1 h</option>
            <option value="90">~1 h 30</option>
            <option value="120">~2 h</option>
          </select>
        </div>
        <div>
          <label>Langue</label>
          <select id="lang">
            <option value="français" selected>Français</option>
            <option value="anglais">Anglais</option>
            <option value="espagnol">Espagnol</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div>
          <label>Ton</label>
          <select id="tone">
            <option value="dynamique et captivant" selected>Dynamique</option>
            <option value="éducatif et clair">Éducatif</option>
            <option value="storytelling immersif">Storytelling</option>
            <option value="humoristique et punchy">Punchy / fun</option>
            <option value="calme et posé">Posé</option>
          </select>
        </div>
        <div>
          <label>Modèle Claude</label>
          <select id="model">
            <option value="claude-opus-4-8" selected>Opus (qualité)</option>
            <option value="claude-sonnet-4-6">Sonnet (rapide)</option>
          </select>
        </div>
      </div>

      <button class="go" id="goBtn">⚡ ÉCRIRE LE SCRIPT</button>
      <div class="status" id="status"></div>
    </div>

    <div class="panel editor">
      <div class="editor-head">
        <div class="counter"><b id="wc">0</b> <span class="tgt">/ <span id="tgt">450</span> mots · ~<span id="tgtmin">3</span> min</span></div>
        <div class="ed-actions">
          <button class="sbtn" id="copyBtn">⧉ Copier</button>
          <button class="sbtn" id="regenBtn">↻ Regénérer</button>
        </div>
      </div>
      <div class="bar"><i id="barFill"></i></div>
      <div class="script" id="script" contenteditable="false" spellcheck="false"></div>
    </div>
  </div>
</div>

<script>
const WPM = 150;
const $ = id => document.getElementById(id);
function setStatus(m,c){const s=$("status");s.innerHTML=m||"";s.className="status"+(c?" "+c:"");}
function wordCount(t){const m=(t||"").trim().match(/\S+/g);return m?m.length:0;}

function target(){ return Math.round(parseInt($("duration").value)*WPM); }
function syncTarget(){ $("tgt").textContent=target(); $("tgtmin").textContent=$("duration").value; updateMeter(); }
function updateMeter(){
  const wc=wordCount($("script").innerText), tgt=target();
  $("wc").textContent=wc;
  $("barFill").style.width=Math.min(100,Math.round(wc/tgt*100))+"%";
}
$("duration").addEventListener("change", syncTarget);

function setBusy(b){ $("goBtn").disabled=b; }

async function generate(){
  const theme=$("theme").value.trim();
  if(!theme){ setStatus("Donne d'abord un thème.","err"); return; }
  const tgt=target();
  const user="Tu es un rédacteur expert de voix off YouTube. Écris UNIQUEMENT le texte de la voix off (la narration), "
    +"prêt à être lu à voix haute : aucune indication de scène, aucune didascalie, aucun titre de section, aucun markdown. "
    +"Langue : "+$("lang").value+". Ton : "+$("tone").value+". "
    +"Longueur cible : environ "+tgt+" mots (~"+$("duration").value+" min à "+WPM+" mots/min) — respecte bien cette longueur. "
    +"Commence par une accroche forte dès la première phrase, garde un rythme soutenu, termine par un appel à l'action.\n\n"
    +"Sujet de la vidéo : "+theme+($("brief").value.trim()?("\n\nDétails / angle : "+$("brief").value.trim()):"");

  setBusy(true); setStatus('<span class="spinner"></span>Claude écrit…');
  $("script").textContent=""; $("script").classList.add("cursor"); updateMeter();

  let text="";
  try{
    const res=await fetch("/api/llm/stream",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:$("model").value,max_tokens:Math.min(32000,Math.round(tgt*2.2)+500),
        messages:[{role:"user",content:user}]})});
    if(!res.ok){ const j=await res.json().catch(()=>({})); throw new Error(j.detail||j.message||("HTTP "+res.status)); }
    const reader=res.body.getReader(), dec=new TextDecoder(); let buf="";
    while(true){
      const {done,value}=await reader.read(); if(done)break;
      buf+=dec.decode(value,{stream:true}); let i;
      while((i=buf.indexOf("\n"))>=0){
        const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
        if(!line.startsWith("data:"))continue;
        const payload=line.slice(5).trim();
        if(payload==="[DONE]")continue;
        let j; try{ j=JSON.parse(payload); }catch(e){ continue; }
        if(j.error) throw new Error(j.detail||"erreur LLM");
        const delta=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
        if(delta){ text+=delta; $("script").textContent=text; updateMeter(); $("script").scrollTop=$("script").scrollHeight; }
      }
    }
    $("script").classList.remove("cursor");
    setStatus("✓ Script terminé · "+wordCount(text)+" mots","ok");
  }catch(e){ $("script").classList.remove("cursor"); setStatus("Erreur : "+e.message,"err"); }
  finally{ setBusy(false); }
}

$("goBtn").addEventListener("click", generate);
$("regenBtn").addEventListener("click", generate);
$("copyBtn").addEventListener("click", ()=>{
  const t=$("script").innerText; if(!t)return;
  navigator.clipboard.writeText(t).then(()=>setStatus("✓ Copié dans le presse-papier","ok"));
});
syncTarget();
</script>
</body>
</html>
