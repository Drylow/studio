<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Title & Description Writer</title>
<style>
  :root{--bg:#03030a;--panel:rgba(12,18,32,.78);--panel2:#0d1322;--border:#1c2740;
    --txt:#e6f0ff;--muted:#7e8db0;--cyan:#00D9FF;--pink:#FF2E9B;--violet:#B44FFF;}
  *{box-sizing:border-box}
  body{margin:0;color:var(--txt);font-family:'Rajdhani','Inter',system-ui,sans-serif;
    background:radial-gradient(1100px 520px at 78% -8%,rgba(0,217,255,.10),transparent 60%),
      radial-gradient(900px 500px at 10% 110%,rgba(255,46,155,.10),transparent 60%),var(--bg);}
  .wrap{max-width:1320px;margin:0 auto;padding:26px 24px 56px;}
  h1{font-family:'Orbitron',sans-serif;font-size:24px;letter-spacing:1px;margin:0;display:flex;align-items:center;gap:10px;}
  h1 b{color:var(--cyan);} h1 .em{filter:drop-shadow(0 0 8px rgba(0,217,255,.5));}
  .sub{color:var(--muted);font-size:13px;font-family:'JetBrains Mono',monospace;margin:6px 0 22px;}
  .studio{display:grid;grid-template-columns:400px 1fr;gap:24px;align-items:start;}
  @media(max-width:920px){.studio{grid-template-columns:1fr;}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;
    backdrop-filter:blur(6px);box-shadow:0 18px 50px rgba(0,0,0,.35);}
  .controls{padding:20px;}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;letter-spacing:.4px;}
  textarea,select,input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:9px;
    color:var(--txt);padding:11px 13px;font-size:14px;font-family:inherit;outline:none;transition:.18s;}
  textarea:focus,select:focus,input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,217,255,.14);}
  textarea{min-height:150px;resize:vertical;line-height:1.45;}
  .seg{display:flex;gap:8px;margin-bottom:4px;}
  .seg button{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:9px;
    padding:9px;font-size:13px;font-family:'Rajdhani',sans-serif;font-weight:700;cursor:pointer;transition:.16s;letter-spacing:.5px;}
  .seg button.on{border-color:var(--cyan);color:var(--cyan);background:rgba(0,217,255,.08);}
  .row{display:flex;gap:12px;} .row>div{flex:1;}
  .go{width:100%;margin-top:18px;background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;border:0;
    border-radius:11px;padding:15px;font-weight:700;font-size:16px;cursor:pointer;font-family:'Rajdhani',sans-serif;
    letter-spacing:1px;box-shadow:0 10px 26px rgba(255,46,155,.28);transition:.18s;}
  .go:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 14px 32px rgba(255,46,155,.4);}
  .go:disabled{opacity:.55;cursor:not-allowed;}
  .status{margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);min-height:18px;}
  .status.err{color:#ff5e7a;} .status.ok{color:#39e6a4;}
  .spinner{width:14px;height:14px;border:2px solid rgba(0,217,255,.25);border-top-color:var(--cyan);
    border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:-2px;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg)}}

  .results{display:flex;flex-direction:column;gap:18px;min-height:560px;padding:18px;}
  .empty{margin:auto;text-align:center;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;}
  .empty .big{font-size:40px;opacity:.4;display:block;margin-bottom:10px;}
  .block{background:#05070f;border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .block h2{font-size:11px;letter-spacing:2px;color:var(--cyan);font-family:'JetBrains Mono',monospace;margin:0 0 12px;
    text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;}
  .cp{cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--muted);border-radius:7px;
    padding:4px 10px;font-size:11px;font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.5px;transition:.16s;}
  .cp:hover{border-color:var(--cyan);color:var(--cyan);}
  .title-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(28,39,64,.6);}
  .title-item:last-child{border-bottom:0;}
  .title-item span{flex:1;font-size:15px;line-height:1.4;}
  .desc{white-space:pre-wrap;font-size:14px;line-height:1.65;color:#cdd9f0;}
  .tags{display:flex;flex-wrap:wrap;gap:7px;}
  .tag{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;color:#cdd9f0;
    font-family:'JetBrains Mono',monospace;}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="em">🏷️</span> <b>TITLE</b> &amp; DESCRIPTION</h1>
  <div class="sub">Titres + description SEO + tags à partir de ton script. Option : colle une description existante pour réécrire dans le même style.</div>

  <div class="studio">
    <div class="panel controls">
      <label>Ton script</label>
      <textarea id="script" placeholder="Colle le script de ta vidéo..."></textarea>

      <label>Description de référence — optionnel (pour copier le style)</label>
      <textarea id="refdesc" placeholder="Colle une description existante dont tu aimes le style, le format et le ton... La nouvelle description sera réécrite dans ce style pour ton script." style="min-height:120px;"></textarea>

      <div class="row">
        <div>
          <label>Langue</label>
          <select id="lang"><option value="français" selected>Français</option><option value="anglais">Anglais</option><option value="espagnol">Espagnol</option></select>
        </div>
        <div>
          <label>Ton</label>
          <select id="tone"><option value="pro et accrocheur" selected>Pro</option><option value="punchy / clickbait léger">Punchy</option><option value="fun et décontracté">Fun</option></select>
        </div>
      </div>
      <label>Modèle Claude</label>
      <select id="model"><option value="claude-opus-4-8" selected>Opus (qualité)</option><option value="claude-sonnet-4-6">Sonnet (rapide)</option></select>

      <button class="go" id="goBtn">⚡ GÉNÉRER</button>
      <div class="status" id="status"></div>
    </div>

    <div class="panel results" id="results">
      <div class="empty" id="empty"><span class="big">🏷️</span>Tes titres, ta description et tes tags<br>apparaîtront ici.</div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
function setStatus(m,c){const s=$("status");s.innerHTML=m||"";s.className="status"+(c?" "+c:"");}

function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function copy(txt,btn){ navigator.clipboard.writeText(txt).then(()=>{const o=btn.textContent;btn.textContent="✓ Copié";setTimeout(()=>btn.textContent=o,1200);}); }

function render(data){
  const r=$("results"); r.innerHTML="";
  // Titres
  const tb=document.createElement("div"); tb.className="block";
  tb.innerHTML='<h2>Titres ('+ (data.titles||[]).length +')</h2>';
  (data.titles||[]).forEach(t=>{
    const row=document.createElement("div"); row.className="title-item";
    row.innerHTML='<span>'+esc(t)+'</span>';
    const b=document.createElement("button"); b.className="cp"; b.textContent="⧉"; b.onclick=()=>copy(t,b);
    row.appendChild(b); tb.appendChild(row);
  });
  r.appendChild(tb);
  // Description
  const db=document.createElement("div"); db.className="block";
  const dh=document.createElement("h2"); dh.innerHTML="Description";
  const dcp=document.createElement("button"); dcp.className="cp"; dcp.textContent="⧉ Copier"; dcp.onclick=()=>copy(data.description||"",dcp);
  dh.appendChild(dcp); db.appendChild(dh);
  const dd=document.createElement("div"); dd.className="desc"; dd.textContent=data.description||""; db.appendChild(dd);
  r.appendChild(db);
  // Tags
  const gb=document.createElement("div"); gb.className="block";
  const gh=document.createElement("h2"); gh.innerHTML="Tags";
  const gcp=document.createElement("button"); gcp.className="cp"; gcp.textContent="⧉ Copier"; gcp.onclick=()=>copy((data.tags||[]).join(", "),gcp);
  gh.appendChild(gcp); gb.appendChild(gh);
  const tagwrap=document.createElement("div"); tagwrap.className="tags";
  (data.tags||[]).forEach(t=>{const e=document.createElement("span");e.className="tag";e.textContent=t;tagwrap.appendChild(e);});
  gb.appendChild(tagwrap); r.appendChild(gb);
}

function parseSections(t){
  t=t||"";
  const titlesRaw=((t.split(/===\s*TITRES\s*===/i)[1]||"").split(/===\s*DESCRIPTION\s*===/i)[0])||"";
  const afterDesc=(t.split(/===\s*DESCRIPTION\s*===/i)[1]||"");
  const descRaw=(afterDesc.split(/===\s*TAGS\s*===/i)[0])||"";
  const tagsRaw=(afterDesc.split(/===\s*TAGS\s*===/i)[1])||"";
  const titles=titlesRaw.split("\n").map(l=>l.replace(/^\s*[-*•\d.)\]]+\s*/,"").trim()).filter(Boolean);
  const tags=tagsRaw.split(/[,\n]/).map(x=>x.replace(/^\s*[-*•#\d.)\]]+\s*/,"").trim()).filter(Boolean);
  return {titles:titles, description:descRaw.trim(), tags:tags};
}

async function generate(){
  const content=$("script").value.trim();
  if(!content){ setStatus("Colle ta narration / le texte de la vidéo.","err"); return; }
  const ref=$("refdesc").value.trim();
  let user="Tu es un expert SEO YouTube. Voici la narration d'une vidéo YouTube :\n"+content+"\n\n";
  if(ref) user+="Pour la DESCRIPTION : imite EXACTEMENT le style, le ton, le format et la mise en page de la description de référence ci-dessous, mais réécris tout le contenu pour CETTE vidéo (n'en reprends pas le sujet) :\n--- RÉFÉRENCE ---\n"+ref+"\n--- FIN RÉFÉRENCE ---\n\n";
  user+="Langue : "+$("lang").value+". Ton : "+$("tone").value+".\n"
    +"Donne le résultat EXACTEMENT dans ce format, sans rien d'autre avant ou après :\n\n"
    +"===TITRES===\n(8 titres accrocheurs et variés, max 70 caractères, un par ligne)\n"
    +"===DESCRIPTION===\n(description optimisée : accroche, résumé, chapitres avec timestamps si déductibles, appel à l'action, puis 3-5 hashtags)\n"
    +"===TAGS===\n(15 tags pertinents séparés par des virgules)";

  $("goBtn").disabled=true; setStatus('<span class="spinner"></span>Claude génère…');
  try{
    const r=await fetch("/api/llm",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:$("model").value,max_tokens:2000,
        messages:[{role:"user",content:user}]})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.detail||j.message||("HTTP "+r.status));
    const data=parseSections(j.text);
    if(!data.titles.length && !data.description) throw new Error("réponse illisible — réessaie");
    render(data); setStatus("✓ Généré","ok");
  }catch(e){ setStatus("Erreur : "+e.message,"err"); }
  finally{ $("goBtn").disabled=false; }
}
$("goBtn").addEventListener("click", generate);
</script>
</body>
</html>
