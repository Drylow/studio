<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project - Explainer Videos</title>
  <script src="../config.js"></script>
  <script src="app.js"></script>
  <script src="pipeline.js"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <nav>
      <a class="brand" href="index.html" aria-label="Explainer Videos"><img src="explainer-videos-logo.webp" alt="Explainer Videos"></a>
      <a href="index.html">Queue</a>
      <a href="library.html">Library</a>
      <a href="settings.html">Settings</a>
      <a href="activity.html">Activity</a>
    </nav>
  </header>
  <main>
<section class="workspace">
  <div class="page-head">
    <div class="row between">
      <h1 id="title">Project</h1>
      <span class="pill" id="statusPill">...</span>
    </div>
    <p id="meta"></p>
    <div class="bar"><span id="progressBar" style="width:0%"></span></div>
    <p id="currentStep" class="sub"></p>
    <div id="errorLine" class="error-line" hidden></div>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="generateBtn">Generate</button>
      <button id="stopBtn" hidden>Stop</button>
      <button class="success" id="renderBtn" hidden>Render MP4</button>
      <button class="danger-text" id="deleteBtn">Delete</button>
    </div>
    <p class="note" id="tabNote" hidden>La génération tourne dans cet onglet — laissez-le ouvert jusqu'à la fin.</p>
  </div>

  <div id="finalPanel" class="panel" hidden>
    <h2>Final video</h2>
    <video id="finalVideo" controls></video>
    <p><a id="finalDownload" href="#" download>Download MP4</a></p>
  </div>

  <div id="renderPanel" class="panel" hidden>
    <h2>Rendu</h2>
    <p id="renderMessage"></p>
    <div class="bar mini"><span id="renderBar" style="width:0%"></span></div>
  </div>

  <div class="panel" style="margin-top:24px">
    <h2>Icons</h2>
    <div class="icon-grid" id="iconGrid"><p>Pas encore d'icônes.</p></div>
  </div>

  <div class="panel" style="margin-top:24px">
    <h2>Chapters</h2>
    <div id="chapterList"><p>Pas encore de chapitres — lancez la génération.</p></div>
  </div>

  <div class="panel activity" style="margin-top:24px">
    <h2>Activity</h2>
    <div id="projectActivity"></div>
  </div>
</section>
  </main>
<script>
const params = new URLSearchParams(location.search);
const projectId = params.get('id');
const objectUrls = [];

function trackUrl(url) { if (url && url.startsWith('blob:')) objectUrls.push(url); return url; }

async function assetUrl(name, fallbackUrl) {
  if (!name) return fallbackUrl || '';
  const asset = await getAsset(projectId, name);
  if (asset && asset.blob) return trackUrl(URL.createObjectURL(asset.blob));
  return (asset && asset.remote_url) || fallbackUrl || '';
}

async function refresh() {
  let project;
  try { project = await getProject(projectId); } catch (_) {
    document.querySelector('#title').textContent = 'Projet introuvable';
    return null;
  }
  title.textContent = project.title;
  statusPill.textContent = project.status;
  statusPill.className = `pill ${project.status}`;
  meta.textContent = `${project.video_length_minutes} min · ${project.width}x${project.height} @ ${project.fps} fps · ${project.chapter_count || '?'} chapitres · créé ${localTime(project.created_at)}`;
  progressBar.style.width = `${project.progress || 0}%`;
  currentStep.textContent = project.current_step || '';
  errorLine.hidden = !project.error;
  errorLine.textContent = project.error || '';

  const running = isProjectRunning(projectId);
  generateBtn.textContent = project.chapters.length ? 'Resume / Retry' : 'Generate';
  generateBtn.hidden = running || project.status === 'rendering';
  stopBtn.hidden = !running;
  tabNote.hidden = !running;
  renderBtn.hidden = !(allChunksReady(project) && !running && project.status !== 'rendering');
  if (!renderBtn.hidden && !RENDER_READY) { renderBtn.disabled = true; renderBtn.title = MSG_NO_RENDER_API; }

  // Final video
  const renderInfo = project.render;
  finalPanel.hidden = !(renderInfo && renderInfo.status === 'done' && renderInfo.output_url);
  if (!finalPanel.hidden) {
    if (finalVideo.getAttribute('src') !== renderInfo.output_url) finalVideo.src = renderInfo.output_url;
    finalDownload.href = renderInfo.output_url;
  }
  renderPanel.hidden = !(renderInfo && ['uploading', 'submitting', 'running'].includes(renderInfo.status));
  if (!renderPanel.hidden) {
    renderMessage.textContent = renderInfo.message || '';
    renderBar.style.width = `${Math.round((renderInfo.progress || 0) * 100)}%`;
  }

  await renderIcons(project);
  await renderChapters(project);
  await renderActivity();
  return project;
}

async function renderIcons(project) {
  const items = [];
  for (const chapter of project.chapters) {
    if (!chapter.icon) continue;
    const url = chapter.icon.asset_name ? await assetUrl(chapter.icon.asset_name, chapter.icon.remote_url) : '';
    items.push(`<div class="icon-item">
      ${url ? `<img src="${escapeAttr(url)}" alt="${escapeAttr(chapter.chapter)}">` : ''}
      <b>${chapter.chapter_number}. ${escapeHtml(chapter.chapter)}</b>
      <span class="pill ${chapter.icon.status === 'done' ? 'done' : 'failed'}">${escapeHtml(chapter.icon.status)}</span>
      ${chapter.icon.error ? `<p class="sub">${escapeHtml(chapter.icon.error)}</p>` : ''}
    </div>`);
  }
  iconGrid.innerHTML = items.length ? items.join('') : '<p>Pas encore d\'icônes.</p>';
}

async function renderChapters(project) {
  if (!project.chapters.length) { chapterList.innerHTML = '<p>Pas encore de chapitres — lancez la génération.</p>'; return; }
  const open = new Set([...chapterList.querySelectorAll('details.item[open]')].map(d => d.dataset.chapter));
  const blocks = [];
  for (const chapter of project.chapters) {
    const chunk = chapter.chunk;
    let chunkHtml = '<p class="sub">Chunk pas encore généré.</p>';
    if (chunk) {
      const voiceUrl = chunk.voice_asset ? await assetUrl(chunk.voice_asset) : '';
      const segmentCards = [];
      for (const segment of chunk.segments || []) {
        if (segment.type === 'intro_animation') {
          segmentCards.push(`<article><b>#${segment.segment_id} intro_animation · ${Number(segment.duration_sec || 0).toFixed(2)}s</b><p class="sub">Animation de zoom rendue par la render API à partir de la grille d'icônes.</p></article>`);
          continue;
        }
        const imageUrl = await assetUrl(segment.asset_name, segment.remote_url);
        segmentCards.push(`<article>
          ${imageUrl ? `<img src="${escapeAttr(imageUrl)}" alt="segment ${segment.segment_id}">` : ''}
          <b>#${segment.segment_id} ${escapeHtml(segment.type)} · ${Number(segment.duration_sec || 0).toFixed(2)}s</b>
          <span class="pill ${segment.status === 'done' ? 'done' : (segment.status === 'failed' ? 'failed' : 'queued')}">${escapeHtml(segment.status || 'queued')}</span>
          ${segment.prompt ? `<p class="sub">${escapeHtml(segment.prompt)}</p>` : ''}
          ${segment.error ? `<p class="sub error-line">${escapeHtml(segment.error)}</p>` : ''}
        </article>`);
      }
      chunkHtml = `
        ${chunk.error ? `<div class="error-line">${escapeHtml(chunk.error)}</div>` : ''}
        ${voiceUrl ? `<audio controls src="${escapeAttr(voiceUrl)}"></audio>` : ''}
        ${chunk.audio_duration ? `<p class="sub">Voix off: ${Number(chunk.audio_duration).toFixed(1)}s</p>` : ''}
        ${chunk.srt ? `<details><summary class="sub">Transcription SRT</summary><pre>${escapeHtml(chunk.srt)}</pre></details>` : ''}
        <div class="segments">${segmentCards.join('')}</div>`;
    }
    blocks.push(`<details class="item" data-chapter="${chapter.chapter_number}" ${open.has(String(chapter.chapter_number)) ? 'open' : ''}>
      <summary><b>${chapter.chapter_number}. ${escapeHtml(chapter.chapter)}</b>
        <span class="pill ${chunk && chunk.status === 'done' ? 'done' : (chapter.status === 'failed' || (chunk && chunk.status === 'failed') ? 'failed' : 'queued')}">${escapeHtml(chunk ? chunk.status : chapter.status)}</span>
      </summary>
      <p class="sub">${escapeHtml(chapter.chapter_topic)}</p>
      ${chapter.error ? `<div class="error-line">${escapeHtml(chapter.error)}</div>` : ''}
      ${chapter.script_text ? `<details><summary class="sub">Script</summary><pre>${escapeHtml(chapter.script_text)}</pre></details>` : '<p class="sub">Pas encore de script.</p>'}
      ${chunkHtml}
    </details>`);
  }
  chapterList.innerHTML = blocks.join('');
}

async function renderActivity() {
  const events = await listEvents(projectId, 100);
  projectActivity.innerHTML = events.map(e => `<div><b>${escapeHtml(e.event)}</b> <span class="sub">${escapeHtml(e.level)}</span><br><span class="sub">${localTime(e.created_at)}</span><p>${escapeHtml(e.message)}</p></div>`).join('') || '<p>Rien pour le moment.</p>';
}

generateBtn.addEventListener('click', startGeneration);
stopBtn.addEventListener('click', async () => { await cancelProject(projectId); await refresh(); });
deleteBtn.addEventListener('click', async () => {
  const project = await getProject(projectId);
  if (!confirm(`Are you sure you want to delete "${project.title}"?`)) return;
  await deleteProjectAndData(projectId);
  location.href = 'index.html';
});
renderBtn.addEventListener('click', async () => {
  renderBtn.disabled = true;
  try {
    await renderProject(projectId, () => refresh());
  } catch (error) {
    alert(String(error.message || error));
  } finally {
    renderBtn.disabled = false;
    await refresh();
  }
});

async function startGeneration() {
  generateBtn.hidden = true;
  stopBtn.hidden = false;
  tabNote.hidden = false;
  try { await generateProject(projectId); } finally { await refresh(); }
}

(async () => {
  const project = await refresh();
  if (project && params.get('start') === '1' && !isProjectRunning(projectId) && project.status !== 'done' && project.status !== 'rendering') {
    startGeneration();
  }
  setInterval(refresh, 4000);
})();

window.addEventListener('pagehide', () => { for (const url of objectUrls) URL.revokeObjectURL(url); });
</script>
</body>
</html>
