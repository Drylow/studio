<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LORE</title>
<style>
  :root{--bg:#080b12;--panel:#0e1626;--panel2:#0b1220;--border:#1b2740;--border2:#23304a;
        --txt:#dbe4f2;--muted:#7c8aa5;--cyan:#33d6e0;--red:#ff3b5c;--gold:#ffc15a;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,Segoe UI,sans-serif;font-size:14px;}
  .wrap{max-width:760px;margin:0 auto;padding:22px 18px 60px;}
  h1{font-size:20px;letter-spacing:3px;margin:0 0 2px;}
  .sub{color:var(--muted);font-size:12px;margin-bottom:18px;}
  .card{background:var(--panel);border:1px solid var(--border2);border-radius:12px;padding:16px;margin-bottom:14px;}
  label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:0 0 5px;}
  input,select{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--txt);
    padding:9px 11px;font-size:14px;font-family:inherit;}
  input:focus,select:focus{outline:none;border-color:var(--cyan);}
  .row{display:flex;gap:12px;}.row>.field{flex:1;}
  .field{margin-bottom:12px;}
  .seg{display:flex;gap:6px;}
  .seg button{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:8px;cursor:pointer;font-size:13px;}
  .seg button.on{border-color:var(--cyan);color:var(--cyan);}
  .go{width:100%;margin-top:6px;background:linear-gradient(90deg,#0f6f78,#1aa6b3);border:none;color:#eafcff;
    font-weight:700;letter-spacing:1px;padding:13px;border-radius:9px;cursor:pointer;font-size:14px;}
  .go:disabled{opacity:.5;cursor:default;}
  .hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5;}
  .warn{background:rgba(255,59,92,.08);border:1px solid rgba(255,59,92,.5);color:#ffb3c0;border-radius:9px;padding:11px 13px;font-size:13px;margin-bottom:14px;}
  .stat{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:var(--muted);white-space:pre-wrap;
    background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:11px;min-height:20px;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:7px;vertical-align:middle;}
  .dot.ok{background:var(--cyan);}.dot.run{background:var(--gold);animation:p 1.2s infinite;}.dot.err{background:var(--red);}
  @keyframes p{50%{opacity:.4;}}
  video{width:100%;border-radius:9px;margin-top:12px;background:#000;}
  a{color:var(--cyan);}
</style>
</head>
<body>
<div class="wrap">
  <h1>▶ LORE</h1>
  <div class="sub">Vidéo entière « pour s'endormir » — narration · visuels · montage · miniature + SEO. Rendu sur le worker distant.</div>

  <div id="warn" class="warn" style="display:none"></div>

  <div class="card">
    <div class="field">
      <label>Titre de la vidéo</label>
      <input id="title" placeholder="ex : La timeline complète de Zelda… pour s'endormir">
    </div>
    <div class="row">
      <div class="field"><label>Univers (franchise)</label><select id="franchise"></select></div>
      <div class="field" style="max-width:140px"><label>Langue</label>
        <select id="lang"><option value="fr">Français</option><option value="en">English</option></select></div>
    </div>
    <div class="field">
      <label>Mode</label>
      <div class="seg">
        <button id="mFacts" class="on" onclick="setMode('facts')">Liste de faits</button>
        <button id="mDur" onclick="setMode('duration')">Durée cible</button>
      </div>
    </div>
    <div id="paneFacts" class="row">
      <div class="field"><label>Nombre de faits</label><input id="facts" type="number" value="100" min="10" max="500"></div>
      <div class="field"><label>Secondes / fait</label><input id="spf" type="number" value="35" min="10" max="120"></div>
    </div>
    <div id="paneDur" class="row" style="display:none">
      <div class="field"><label>Durée (minutes)</label><input id="duration" type="number" value="20" min="3" max="180"></div>
      <div class="field"><label>Min. / image (mpb)</label><input id="mpb" type="number" value="0.6" step="0.1" min="0.2" max="6"></div>
    </div>
    <button class="go" id="go" onclick="launch()">Lancer le rendu</button>
    <div class="hint">⚠️ Un rendu consomme des crédits (voix, images) et prend ~20 min. La vidéo arrive ci-dessous quand c'est prêt. Tu peux fermer/rouvrir, le worker continue.</div>
  </div>

  <div class="card">
    <label>État</label>
    <div class="stat" id="stat"><span class="dot" id="dot"></span>En attente.</div>
    <div id="result"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let MODE="facts", SERIES=new Set(["simpsons","spongebob","gravityfalls","rickandmorty"]);
let polling=false;

function setMode(m){MODE=m;
  $("mFacts").classList.toggle("on",m==="facts");$("mDur").classList.toggle("on",m==="duration");
  $("paneFacts").style.display=m==="facts"?"flex":"none";$("paneDur").style.display=m==="duration"?"flex":"none";}

function setStat(cls,txt){$("dot").className="dot"+(cls?" "+cls:"");$("stat").innerHTML='<span class="dot '+(cls||"")+'" id="dot"></span>'+txt;}

async function init(){
  try{
    const j=await(await fetch("/api/lore/status",{headers:{Accept:"application/json"}})).json();
    const sel=$("franchise");
    (j.franchises||[]).forEach(f=>{const o=document.createElement("option");o.value=f.id;
      o.textContent=f.name+(f.kind==="series"?" (série)":"");sel.appendChild(o);});
    if(!j.configured){$("warn").style.display="block";
      $("warn").textContent="⚠️ Le worker de rendu n'est pas configuré (LORE_WORKER_URL absent). Le bouton ne marchera pas tant que ce n'est pas branché.";
      $("go").disabled=true;}
  }catch(e){$("warn").style.display="block";$("warn").textContent="// Impossible de joindre /api/lore/status";}
}

async function launch(){
  const title=$("title").value.trim();
  if(!title){$("title").focus();return;}
  const fr=$("franchise").value;
  const body={title,franchise:fr,lang:$("lang").value};
  if(MODE==="duration"){body.duration=parseFloat($("duration").value)||20;body.mpb=parseFloat($("mpb").value)||0.6;}
  else{body.facts=parseInt($("facts").value)||100;body.spf=parseInt($("spf").value)||35;}
  if(SERIES.has(fr))body.clip=true;
  $("go").disabled=true;$("result").innerHTML="";setStat("run","Démarrage du rendu…");
  let j;
  try{ j=await(await fetch("/api/lore/render",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})).json(); }
  catch(e){ setStat("err","Échec réseau.");$("go").disabled=false;return; }
  if(j.error){ setStat("err",(j.detail||j.message||j.error)); $("go").disabled=false; return; }
  const jobId=j.jobId||j.id;
  if(!jobId){ setStat("err","Pas de job renvoyé."); $("go").disabled=false; return; }
  poll(jobId, Date.now());
}

async function poll(jobId,t0){
  if(polling)return; polling=true;
  const tick=async()=>{
    let st;
    try{ st=await(await fetch("/api/lore/jobs/"+encodeURIComponent(jobId),{headers:{Accept:"application/json"}})).json(); }
    catch(e){ setTimeout(tick,8000); return; }
    const mins=Math.floor((Date.now()-t0)/60000), secs=Math.floor(((Date.now()-t0)%60000)/1000);
    const elapsed=mins+"m"+(secs<10?"0":"")+secs+"s";
    const s=st.status||"?";
    if(s==="done"){ polling=false;$("go").disabled=false;
      setStat("ok","Terminé en "+elapsed+".");
      $("result").innerHTML='<video src="/api/lore/jobs/'+encodeURIComponent(jobId)+'/video" controls></video>'
        +'<div class="hint">Job '+jobId+' — la miniature et les métadonnées (titre/desc/tags) sont incluses par le tool. Pour publier sur la chaîne, passe par Delamain (il poste avec la miniature et le SEO).</div>';
      return; }
    if(s==="failed"){ polling=false;$("go").disabled=false;setStat("err","Rendu échoué : "+(st.error||"")); return; }
    setStat("run",s+" — "+elapsed+" écoulées"+(st.progress?(" · "+st.progress):"")+"\njob "+jobId);
    setTimeout(tick,8000);
  };
  tick();
}

init();
</script>
</body>
</html>
