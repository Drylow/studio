<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oddly Specific Lives</title>
<link rel="stylesheet" href="../pov-studio/app.css">
<link rel="stylesheet" href="osl.css">
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">OSL</div><span>Oddly Specific <b>Lives</b></span></div>
  <div class="status-dots" id="topInfo"></div>
  <a class="btn sm ghost" href="/tools/pov-studio" target="_top" title="L'éditeur complet : script, voix, storyboard, montage">Éditeur avancé ↗</a>
</header>

<main class="osl">
  <section class="card newvid">
    <h2>Nouvelle vidéo</h2>
    <div class="sub">Tu mets le titre et la durée. Le studio fait le reste : script FacelessOS (calé sur la vidéo Female Yakuza), voix Algrow, personnages consistants, images, musique et montage.</div>
    <label class="f"><span class="lbl">Titre</span>
      <input type="text" id="title" maxlength="140" placeholder="POV: You Marry a Japanese Woman" autocomplete="off"></label>
    <div class="durrow">
      <label class="f grow"><span class="lbl">Durée de la vidéo <b id="minOut">14 min</b></span>
        <input type="range" id="minutes" min="3" max="30" step="1" value="14"></label>
      <div class="chips" id="chips"></div>
    </div>
    <div class="est" id="est"></div>
    <details class="notes"><summary>Consignes (facultatif)</summary>
      <textarea id="notes" rows="3" placeholder="Un angle, une ville, un détail à placer… (sinon le studio choisit)"></textarea>
    </details>
    <div class="row between" style="margin-top:14px">
      <div class="hint" id="refHint"></div>
      <button class="btn primary big" id="create">🎬 Créer la vidéo</button>
    </div>
  </section>

  <div class="section-title"><h2>Vidéos</h2><span class="faint small" id="count"></span></div>
  <section id="list" class="vlist"></section>
</main>

<div id="modalRoot"></div>
<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>
<div class="toast-wrap" id="toasts"></div>
<script src="osl.js"></script>
</body>
</html>
