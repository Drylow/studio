<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Babylon 3D Timelapse</title>
    <script type="importmap">{ "imports": { "three": "./lib/three.module.js", "postprocessing": "./lib/postprocessing.js", "n8ao": "./lib/n8ao.js", "three/examples/jsm/": "./lib/jsm/", "three/addons/": "./lib/jsm/" } }</script>
    <style>
      /* fonts ship with the project so every machine renders the same */
      @font-face { font-family: "Barlow Condensed"; src: url("assets/fonts/barlow-condensed-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Barlow Condensed"; src: url("assets/fonts/barlow-condensed-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Barlow Condensed"; src: url("assets/fonts/barlow-condensed-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Cinzel"; src: url("assets/fonts/cinzel-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Cinzel"; src: url("assets/fonts/cinzel-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-garamond-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #world { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #ui, .over { position: absolute; inset: 0; pointer-events: none; color: #fff; }
      .sh { text-shadow: 0 2px 10px rgba(0, 0, 0, 0.62), 0 0 3px rgba(0, 0, 0, 0.5), 0 1px 1px rgba(0, 0, 0, 0.35); }
      /* soft shading in the HUD corners: the desert is bright */
      .corner { position: absolute; pointer-events: none; }
      #cBL { left: -260px; bottom: -220px; width: 1150px; height: 560px; background: radial-gradient(ellipse at center, rgba(16, 13, 8, 0.5), rgba(16, 13, 8, 0.22) 45%, rgba(16, 13, 8, 0) 70%); }
      #cBR { right: -260px; bottom: -220px; width: 900px; height: 520px; background: radial-gradient(ellipse at center, rgba(16, 13, 8, 0.5), rgba(16, 13, 8, 0.22) 45%, rgba(16, 13, 8, 0) 70%); }
      #cTR { right: -220px; top: -200px; width: 800px; height: 420px; background: radial-gradient(ellipse at center, rgba(16, 13, 8, 0.45), rgba(16, 13, 8, 0.2) 45%, rgba(16, 13, 8, 0) 70%); }
      /* year: bottom-right, condensed bold */
      #year { position: absolute; right: 74px; bottom: 66px; font: 700 104px/1 "Barlow Condensed", sans-serif; letter-spacing: 5px; text-align: right; }
      /* era: flag tile above a tracked caps label, bottom-left */
      #era { position: absolute; left: 76px; bottom: 74px; }
      #flag { width: 140px; height: 84px; margin-bottom: 18px; box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35); }
      #flag svg { display: block; width: 140px; height: 84px; }
      #eraName { font: 500 38px/1 "Barlow Condensed", sans-serif; letter-spacing: 3.5px; }
      /* population: top-right */
      #pop { position: absolute; right: 74px; top: 52px; display: flex; align-items: center; gap: 16px; font: 500 46px/1 "Barlow Condensed", sans-serif; letter-spacing: 2px; }
      #pop svg { width: 30px; height: 36px; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.45)); }
      /* opening title */
      #title { position: absolute; left: 0; right: 0; top: 300px; text-align: center; }
      #title .big { font: 600 84px/1 "Cinzel", serif; letter-spacing: 0.32em; padding-left: 0.32em; color: #f6efe2; }
      #title .small { margin-top: 26px; font: 400 25px/1 "Cinzel", serif; letter-spacing: 0.5em; padding-left: 0.5em; color: #efe6d4; }
      /* landmark name with hairlines */
      #lm { position: absolute; left: 0; right: 0; top: 846px; display: flex; align-items: center; justify-content: center; gap: 34px; }
      #lm .rule { width: 170px; height: 1.5px; background: rgba(255, 255, 255, 0.75); }
      #lmText { font: 400 58px/1 "Cinzel", serif; letter-spacing: 0.28em; padding-left: 0.28em; color: #fbf6ec; }
      /* explanatory caption with gold rules */
      #cap { position: absolute; left: 0; right: 0; top: 748px; text-align: center; }
      #cap .rule { width: 230px; height: 2px; background: #c9a45c; margin: 0 auto; }
      #cap .line { font: 500 36px/1.5 "Cormorant Garamond", serif; color: #fbf7ef; letter-spacing: 0.3px; }
      #cap .rule.top { margin-bottom: 14px; } #cap .rule.bot { margin-top: 14px; }
      /* chapter card */
      #card { position: absolute; left: 0; right: 0; top: 802px; text-align: center; }
      #cardK { font: 400 20px/1 "Cinzel", serif; letter-spacing: 0.6em; padding-left: 0.6em; color: #efe5d0; }
      #cardT { margin-top: 16px; font: 400 64px/1 "Cinzel", serif; letter-spacing: 0.26em; padding-left: 0.26em; color: #fbf6ec; }
      /* soft dark backing behind centred serif text (no boxes, just a falloff) */
      #title::before, #lm::before, #cap::before, #card::before { content: ""; position: absolute; left: 50%; top: 50%; width: 1500px; height: 300px; transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(14, 12, 8, 0.6), rgba(14, 12, 8, 0.28) 45%, rgba(14, 12, 8, 0) 70%); z-index: -1; }
      #black { position: absolute; inset: 0; background: #000; pointer-events: none; }
      #preload { position: absolute; left: 0; top: 0; opacity: 0; font-size: 10px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-no-timeline data-start="0" data-duration="305" data-width="1920" data-height="1080">
      <canvas id="world" width="2880" height="1620"></canvas>
      <div id="ui"><div class="corner" id="cBL"></div><div class="corner" id="cBR"></div><div class="corner" id="cTR"></div>
        <div id="pop" class="sh"><svg viewBox="0 0 30 36"><circle cx="15" cy="9" r="8" fill="#fff"/><path d="M1 36 Q1 20 15 20 Q29 20 29 36Z" fill="#fff"/></svg><span id="popN">c. 0</span></div>
        <div id="era"><div id="flag"></div><div id="eraName" class="sh"></div></div>
        <div id="year" class="sh"></div>
      </div>
      <div class="over">
        <div id="title" class="sh" style="opacity:0"><div class="big">BABYLON</div><div class="small">1900 BC – AD 200</div></div>
        <div id="lm" class="sh" style="opacity:0"><div class="rule"></div><div id="lmText"></div><div class="rule"></div></div>
        <div id="cap" class="sh" style="opacity:0"><div class="rule top"></div><div class="line" id="capL1"></div><div class="line" id="capL2"></div><div class="rule bot"></div></div>
        <div id="card" class="sh" style="opacity:0"><div id="cardK"></div><div id="cardT"></div></div>
      </div>
      <div id="black"></div>
      <div id="preload"><span style="font-family:'Barlow Condensed';font-weight:500">A</span><span style="font-family:'Barlow Condensed';font-weight:700">A</span><span style="font-family:Cinzel;font-weight:400">A</span><span style="font-family:Cinzel;font-weight:600">A</span><span style="font-family:'Cormorant Garamond';font-weight:500">A</span></div>
      <audio id="music" src="assets/music.m4a" data-start="0" data-duration="305" data-volume="1"></audio>
    </div>
    <script type="module">
      import { buildVideo } from "./scene.js";
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      const $ = (id) => document.getElementById(id);
      const hud = { ui: $("ui"), year: $("year"), era: $("era"), flag: $("flag"), eraName: $("eraName"), pop: $("pop"), popN: $("popN"), title: $("title"), lm: $("lm"), lmText: $("lmText"), cap: $("cap"), capL1: $("capL1"), capL2: $("capL2"), card: $("card"), cardK: $("cardK"), cardT: $("cardT"), black: $("black") };
      let v = null;
      const fonts = ["500 38px 'Barlow Condensed'", "700 104px 'Barlow Condensed'", "400 58px Cinzel", "600 84px Cinzel", "500 36px 'Cormorant Garamond'"].map((f) => document.fonts.load(f));
      window.__hf.buildReady["scene"] = Promise.all(fonts).then(() => { v = buildVideo($("world"), hud); window.__video = v; return v.ready; }).then(() => v.renderAt(window.__hfThreeTime || 0));
      window.addEventListener("hf-seek", (e) => { if (v) v.renderAt(e.detail.time); });
    </script>
  </body>
</html>
