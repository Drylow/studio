<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=1080, height=1920">
 <title>Watermelon - pixel cuts</title>
 <script>window.__timelines=window.__timelines||{};</script>
 <script src="assets/gsap.min.js"></script>
 <style>
  html,body{margin:0;width:100%;height:100%;background:#f1e7d6;color:#203c2a}
  #root{position:relative;width:100%;height:100%;overflow:hidden}
  .clip{position:absolute;inset:0}
  #fruit-canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
 </style>
</head>
<body>
 <div data-hf-id="hf-if0g" id="root" data-composition-id="watermelon" data-width="1080" data-height="1920" data-duration="41.8">
   <canvas data-hf-id="hf-3zzb" id="fruit-canvas" class="clip" data-start="0" data-duration="41.8" data-track-index="1" data-layout-allow-overflow=""></canvas>
  <audio data-hf-id="hf-u9nv" id="cuts-audio" src="assets/sound.wav" data-start="0" data-duration="41.8" data-track-index="2" data-volume="0.85"></audio>
 </div>
 <script src="assets/scene.js"></script>
 <script>
  const clock={t:0};
  const tl=gsap.timeline({paused:true});
  tl.to(clock,{t:41.8,duration:41.8,ease:'none',onUpdate:()=>window.drawFruit(clock.t)},0);
  window.__timelines['watermelon']=tl;
 </script>
</body>
</html>
