<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>TubeForge | Studio</title>
  <link rel="stylesheet" href="/workspace.css">
  <script src="/workspace.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="app-header">
    <a class="brand" href="#/videos" aria-label="TubeForge videos"><span class="brand-mark" aria-hidden="true">TF</span><span>TubeForge <small>Team studio</small></span></a>
    <nav class="primary-nav" aria-label="Main navigation">
      <a href="#/videos" data-nav="videos">Videos</a>
      <a href="#/channels" data-nav="channels">Channels</a>
      <a href="#/styles" data-nav="styles">Styles</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <span id="connection" class="connection">Connecting&hellip;</span>
    <div id="account" class="account" hidden></div>
  </header>
  <main id="main" tabindex="-1" aria-busy="true"><div class="empty">Loading your studio&hellip;</div></main>
  <div id="notifications" class="notifications" role="status" aria-live="polite"></div>
  <dialog id="create-dialog" aria-labelledby="create-heading"></dialog>
  <dialog id="preview-dialog" aria-label="Image preview"></dialog>
  <noscript>Enable JavaScript to open the studio.</noscript>
</body>
</html>
